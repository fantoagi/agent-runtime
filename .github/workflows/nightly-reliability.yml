name: nightly-reliability

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Soak duration in seconds"
        required: false
        default: "1800"

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and quality dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[api,quality]" pytest-randomly pytest-repeat

      - name: Full test suite in randomized order
        run: python -m pytest -p no:cacheprovider

      - name: Repeat fault-injection and reliability tests
        run: python -m pytest tests/test_providers.py tests/test_reliability.py tests/test_contract_edges.py --count=3 -p no:cacheprovider

      - name: Forced-crash recovery matrix
        run: python scripts/run_crash_recovery.py --repeat 20 --output crash-result.json

      - name: 100-run stress and soak
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '1800' }}
        run: >-
          python scripts/run_reliability.py
          --stress-runs 100
          --concurrency 20
          --soak-seconds "$SOAK_SECONDS"
          --output reliability-result.json

      - name: Performance regression gate
        run: >-
          python scripts/check_performance.py
          reliability-result.json
          benchmarks/reliability-baseline.json
          --max-regression 20

      - name: Build release artifacts
        run: python -m build

      - name: Verify release artifact
        run: python scripts/verify_distribution.py dist/agent_runtime-0.7.7-py3-none-any.whl

      - name: Upload reliability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-result
          path: |
            reliability-result.json
            crash-result.json
          if-no-files-found: warn
