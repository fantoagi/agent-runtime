[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.7.12"
description = "A durable runtime for tool-calling agents and multi-agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentZone" }]
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
quality = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast isolated behavior tests",
    "integration: tests spanning runtime subsystems",
    "stress: bounded concurrency and contention tests",
    "soak: long-running resource stability tests",
    "crash: process-level forced termination and recovery tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_runtime"]

[tool.coverage.run]
branch = true
source = ["agent_runtime"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
